# HTTP -> HTTPS
server {
    listen 80;
    server_name sebastian.sebaces.fyi;

    return 301 https://$host$request_uri;
}

# HTTPS REAL
server {
    listen 443 ssl;
    http2 on;

    server_name sebastian.sebaces.fyi;

    ssl_certificate /etc/letsencrypt/live/sebastian.sebaces.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sebastian.sebaces.fyi/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://serv-mech-web:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://serv-mech-api:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /flutter/ {
    #     proxy_pass http://serv-mech-flutter-web:80/;

    #     proxy_http_version 1.1;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}


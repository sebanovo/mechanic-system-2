@if (open()) {
	<div class="fixed inset-0 z-50" role="dialog" aria-modal="true">
		<div
			class="absolute inset-0 bg-black/50"
			aria-hidden="true"
			(click)="close()"
		></div>

		<section
			class="bg-background text-foreground absolute inset-y-0 right-0 flex w-full flex-col border-l shadow-xl sm:w-[90vw]"
			[class]="widthClass()"
		>
			<header
				class="flex shrink-0 items-start justify-between gap-4 border-b px-4 py-4 sm:px-6"
			>
				<div class="min-w-0">
					<h2 class="truncate text-lg font-semibold">
						{{ title() }}
					</h2>

					@if (description()) {
						<p class="text-muted-foreground mt-1 text-sm leading-6">
							{{ description() }}
						</p>
					}
				</div>

				<button
					type="button"
					hlmBtn
					variant="ghost"
					size="icon"
					class="shrink-0 cursor-pointer"
					aria-label="Cerrar"
					(click)="close()"
				>
					<ng-icon name="lucideX" class="size-4" />
				</button>
			</header>

			<div class="min-h-0 flex-1 overflow-y-auto px-4 py-5 sm:px-6">
				<ng-content />
			</div>
		</section>
	</div>
}

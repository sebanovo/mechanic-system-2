<div
	class="border-destructive/40 bg-card text-card-foreground flex min-h-64 flex-col items-center justify-center rounded-xl border p-8 text-center"
>
	<div
		class="bg-destructive/10 text-destructive mb-5 flex size-11 items-center justify-center rounded-full"
	>
		<ng-icon name="lucideAlertCircle" class="size-5" />
	</div>

	<h3 class="text-base font-semibold">
		{{ title() }}
	</h3>

	<p class="text-muted-foreground mt-2 max-w-md text-sm">
		{{ description() }}
	</p>

	@if (showAction()) {
		<button
			type="button"
			hlmBtn
			variant="outline"
			class="mt-5 cursor-pointer"
			(click)="actionClicked.emit()"
		>
			<ng-icon name="lucideRefreshCcw" class="mr-2 size-4" />
			{{ actionLabel() }}
		</button>
	}
</div>

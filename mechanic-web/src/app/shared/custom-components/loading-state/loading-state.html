<div
	class="bg-card text-card-foreground flex flex-col items-center justify-center rounded-xl border p-8 text-center"
	[class]="minHeight()"
>
	<div
		class="border-muted-foreground/20 border-t-primary mb-5 size-10 animate-spin rounded-full border-4"
		aria-hidden="true"
	></div>

	<h3 class="text-base font-semibold">
		{{ title() }}
	</h3>

	<p class="text-muted-foreground mt-2 max-w-md text-sm">
		{{ description() }}
	</p>
</div>

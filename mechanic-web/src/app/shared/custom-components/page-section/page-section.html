<section class="bg-card text-card-foreground my-2 rounded-xl border shadow-sm">
	@if (title() || description()) {
		<header class="border-b px-4 py-4 sm:px-6">
			@if (title()) {
				<h2 class="text-base font-semibold">
					{{ title() }}
				</h2>
			}

			@if (description()) {
				<p class="text-muted-foreground mt-1 text-sm">
					{{ description() }}
				</p>
			}
		</header>
	}

	<div [class.p-4]="padded()" [class.sm:p-6]="padded()">
		<ng-content />
	</div>
</section>

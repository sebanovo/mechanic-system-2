<!-- margin top and bottom agregado -->
<div
	class="bg-card text-card-foreground my-2 flex flex-col gap-3 rounded-xl border p-3 shadow-sm sm:flex-row sm:items-center sm:justify-between"
>
	<div class="min-w-0 flex-1">
		@if (showSearch()) {
			<app-search-input
				[value]="search()"
				[placeholder]="searchPlaceholder()"
				(searchChanged)="searchChanged.emit($event)"
			/>
		}
	</div>

	<div class="flex shrink-0 flex-col gap-2 sm:flex-row sm:items-center">
		@if (showFilters()) {
			<button
				type="button"
				hlmBtn
				variant="outline"
				class="cursor-pointer"
				(click)="filtersClicked.emit()"
			>
				<ng-icon name="lucideFilter" class="mr-2 size-4" />
				Filtros
			</button>
		}

		@if (showAdvancedFilters()) {
			<button
				type="button"
				hlmBtn
				variant="outline"
				class="cursor-pointer"
				(click)="advancedFiltersClicked.emit()"
			>
				<ng-icon name="lucideSlidersHorizontal" class="mr-2 size-4" />
				Avanzado
			</button>
		}

		@if (showRefresh()) {
			<button
				type="button"
				hlmBtn
				variant="outline"
				class="cursor-pointer"
				(click)="refreshClicked.emit()"
			>
				<ng-icon name="lucideRefreshCcw" class="mr-2 size-4" />
				Actualizar
			</button>
		}
	</div>
</div>

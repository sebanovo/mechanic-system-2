<app-admin-page-shell>
	<app-page-header
		eyebrow="Cliente"
		title="Editar vehículo"
		description="Actualiza los datos, cambia el estado o elimina el vehículo."
	/>

	@if (loading()) {
		<div class="rounded-2xl border border-black bg-[#FFF4CC] p-6 font-medium">
			Cargando vehículo...
		</div>
	} @else if (errorMessage()) {
		<div class="rounded-2xl border border-black bg-[#FFF4CC] p-6">
			<p class="font-semibold">No se pudo cargar el vehículo.</p>
			<p class="mt-1">{{ errorMessage() }}</p>
			<div class="mt-4">
				<button type="button" hlmBtn variant="outline" class="cursor-pointer" (click)="cancel()">Volver</button>
			</div>
		</div>
	} @else if (vehicleDetail()) {
		<form class="space-y-5 rounded-2xl border border-black bg-[#FFF4CC] p-5" [formGroup]="form">
			<div class="grid gap-4 md:grid-cols-2">
				<hlm-field>
					<label hlmFieldLabel for="brand">Marca</label>
					<input id="brand" hlmInput type="text" formControlName="brand" placeholder="Toyota" />
				</hlm-field>

				<hlm-field>
					<label hlmFieldLabel for="model">Modelo</label>
					<input id="model" hlmInput type="text" formControlName="model" placeholder="Corolla" />
				</hlm-field>
			</div>

			<div class="grid gap-4 md:grid-cols-2">
				<hlm-field>
					<label hlmFieldLabel for="plate_number">Placa</label>
					<input id="plate_number" hlmInput type="text" formControlName="plate_number" />
				</hlm-field>

				<hlm-field>
					<label hlmFieldLabel for="vehicle_type">Tipo de vehículo</label>
					<select id="vehicle_type" class="h-10 w-full rounded-md border border-black bg-[#FFFBEB] px-3 text-sm" formControlName="vehicle_type">
						@for (option of vehicleTypeOptions; track option.value) {
							<option [value]="option.value">{{ option.label }}</option>
						}
					</select>
				</hlm-field>
			</div>

			<div class="grid gap-4 md:grid-cols-2">
				<hlm-field>
					<label hlmFieldLabel for="color">Color</label>
					<input id="color" hlmInput type="text" formControlName="color" />
				</hlm-field>

				<hlm-field>
					<label hlmFieldLabel for="year">Año</label>
					<input id="year" hlmInput type="number" formControlName="year" />
				</hlm-field>
			</div>

			<div class="grid gap-4 md:grid-cols-2">
				<hlm-field>
					<label hlmFieldLabel for="status">Estado</label>
					<select id="status" class="h-10 w-full rounded-md border border-black bg-[#FFFBEB] px-3 text-sm" formControlName="status">
						@for (option of statusOptions; track option.value) {
							<option [value]="option.value">{{ option.label }}</option>
						}
					</select>
				</hlm-field>

				<div class="flex items-end gap-2">
					<button type="button" hlmBtn variant="outline" class="cursor-pointer" [disabled]="saving()" (click)="changeStatus()">Cambiar estado</button>
					<button type="button" hlmBtn variant="outline" class="cursor-pointer" [disabled]="deleting()" (click)="deleteVehicle()">Eliminar vehículo</button>
				</div>
			</div>

			@if (errorMessage()) {
				<div class="rounded-xl border border-black bg-black px-3 py-2 text-sm text-[#FFFBEB]">
					{{ errorMessage() }}
				</div>
			}

			<div class="flex justify-end gap-2">
				<button type="button" hlmBtn variant="outline" class="cursor-pointer" (click)="cancel()">Cancelar</button>
				<button type="button" hlmBtn class="cursor-pointer" [disabled]="saving()" (click)="save()">
					@if (saving()) {
						Guardando...
					} @else {
						Guardar cambios
					}
				</button>
			</div>
		</form>
	}
</app-admin-page-shell>

<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<section class="bg-muted/40 rounded-lg border p-4 text-sm">
		<p class="font-medium">
			{{ item().service_catalog.service_name }}
		</p>

		<p class="text-muted-foreground mt-1">
			{{ item().service_catalog.category }} ·
			{{ item().service_catalog.service_code }}
		</p>

		<p class="text-muted-foreground mt-2">
			Precio catálogo: {{ catalogPriceLabel() }}
		</p>
	</section>

	<label class="bg-card flex items-start gap-3 rounded-lg border p-4 text-sm">
		<input
			type="checkbox"
			formControlName="is_available"
			class="accent-primary mt-0.5 size-4"
		/>

		<span>
			<span class="block font-medium"> Servicio disponible </span>

			<span class="text-muted-foreground mt-1 block leading-6">
				Permite que el taller sea candidato para incidentes de este servicio.
			</span>
		</span>
	</label>

	<div class="grid gap-4 sm:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="edit_custom_min_price">
				Precio mínimo personalizado
			</label>

			<input
				id="edit_custom_min_price"
				type="number"
				hlmInput
				formControlName="custom_min_price"
				min="0"
			/>
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="edit_custom_max_price">
				Precio máximo personalizado
			</label>

			<input
				id="edit_custom_max_price"
				type="number"
				hlmInput
				formControlName="custom_max_price"
				min="0"
			/>
		</hlm-field>
	</div>

	@if (errorMessage()) {
		<div
			class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm"
		>
			{{ errorMessage() }}
		</div>
	}

	<div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
		<button
			type="button"
			hlmBtn
			variant="outline"
			class="cursor-pointer"
			[disabled]="isSubmitting()"
			(click)="cancel()"
		>
			Cancelar
		</button>

		<button
			type="submit"
			hlmBtn
			class="cursor-pointer"
			[disabled]="isSubmitting()"
		>
			@if (isSubmitting()) {
				Guardando...
			} @else {
				Guardar cambios
			}
		</button>
	</div>
</form>

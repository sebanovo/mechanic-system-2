<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<section class="bg-muted/40 rounded-lg border p-4 text-sm">
		<p class="font-medium">
			{{ item().provider_service.service_catalog.service_name }}
		</p>

		<p class="text-muted-foreground mt-1">
			{{ item().provider_service.service_catalog.category }}
			·
			{{ item().provider_service.service_catalog.service_code }}
		</p>

		<p class="text-muted-foreground mt-2">
			Técnico: {{ item().technician.technician_code }}
		</p>
	</section>

	<hlm-field>
		<label hlmFieldLabel for="skill_level">Nivel del técnico</label>

		<select
			id="skill_level"
			formControlName="skill_level"
			class="border-input bg-background h-10 w-full rounded-md border px-3 text-sm"
		>
			@for (option of skillLevelOptions; track option.value) {
				<option [value]="option.value">
					{{ option.label }}
				</option>
			}
		</select>
	</hlm-field>

	<label class="bg-card flex items-start gap-3 rounded-lg border p-4 text-sm">
		<input
			type="checkbox"
			formControlName="is_enabled"
			class="accent-primary mt-0.5 size-4"
		/>

		<span>
			<span class="block font-medium">
				Servicio habilitado para este técnico
			</span>

			<span class="text-muted-foreground mt-1 block leading-6">
				Permite que este técnico sea considerado para atender incidentes de este
				servicio.
			</span>
		</span>
	</label>

	@if (errorMessage()) {
		<div
			class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm"
		>
			{{ errorMessage() }}
		</div>
	}

	<div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
		<button
			type="button"
			hlmBtn
			variant="outline"
			class="cursor-pointer"
			[disabled]="isSubmitting()"
			(click)="cancel()"
		>
			Cancelar
		</button>

		<button
			type="submit"
			hlmBtn
			class="cursor-pointer"
			[disabled]="isSubmitting()"
		>
			@if (isSubmitting()) {
				Guardando...
			} @else {
				Guardar cambios
			}
		</button>
	</div>
</form>

<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="analysis_version">Versión</label>
			<input id="analysis_version" hlmInput formControlName="analysis_version" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="recommended_priority">Prioridad recomendada</label>
			<select id="recommended_priority" class="border-input bg-background h-10 w-full rounded-md border px-3 text-sm" formControlName="recommended_priority">
				<option value="">Sin prioridad</option>
				@for (option of priorityOptions; track option.value) {
					<option [value]="option.value">{{ option.label }}</option>
				}
			</select>
		</hlm-field>
	</div>

	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="probable_service_code">Código de servicio</label>
			<input id="probable_service_code" hlmInput formControlName="probable_service_code" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="probable_problem">Problema probable</label>
			<input id="probable_problem" hlmInput formControlName="probable_problem" />
		</hlm-field>
	</div>

	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="confidence_score">Score de confianza</label>
			<input id="confidence_score" hlmInput type="number" min="0" max="100" step="0.01" formControlName="confidence_score" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="analysis_result">Resultado JSON</label>
			<textarea id="analysis_result" hlmTextarea rows="6" formControlName="analysis_result" placeholder='{"source":"rule_engine"}'></textarea>
		</hlm-field>
	</div>

	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="estimated_min_price">Precio mínimo</label>
			<input id="estimated_min_price" hlmInput type="number" min="0" step="0.01" formControlName="estimated_min_price" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="estimated_max_price">Precio máximo</label>
			<input id="estimated_max_price" hlmInput type="number" min="0" step="0.01" formControlName="estimated_max_price" />
		</hlm-field>
	</div>

	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="estimated_min_duration_minutes">Duración mínima</label>
			<input id="estimated_min_duration_minutes" hlmInput type="number" min="1" step="1" formControlName="estimated_min_duration_minutes" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="estimated_max_duration_minutes">Duración máxima</label>
			<input id="estimated_max_duration_minutes" hlmInput type="number" min="1" step="1" formControlName="estimated_max_duration_minutes" />
		</hlm-field>
	</div>

	@if (errorMessage()) {
		<div class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm">
			{{ errorMessage() }}
		</div>
	}

	<div class="flex items-center justify-end gap-2">
		<button type="button" hlmBtn variant="outline" (click)="cancel()">Cancelar</button>
		<button type="submit" hlmBtn [disabled]="isSubmitting()">Crear análisis</button>
	</div>
</form>

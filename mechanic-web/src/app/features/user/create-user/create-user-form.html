<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="first_name">Nombre</label>
			<input id="first_name" hlmInput formControlName="first_name" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="last_name">Apellido</label>
			<input id="last_name" hlmInput formControlName="last_name" />
		</hlm-field>
	</div>

	<hlm-field>
		<label hlmFieldLabel for="email">Correo electrónico</label>
		<input id="email" type="email" hlmInput formControlName="email" />
	</hlm-field>

	<div class="grid gap-4 md:grid-cols-2">
		<hlm-field>
			<label hlmFieldLabel for="password">Contraseña temporal</label>
			<input id="password" type="password" hlmInput formControlName="password" />
		</hlm-field>

		<hlm-field>
			<label hlmFieldLabel for="user_type">Tipo de usuario</label>
			<select id="user_type" class="border-input bg-background h-10 w-full rounded-md border px-3 text-sm" formControlName="user_type">
				@for (option of userTypeOptions; track option.value) {
					<option [value]="option.value">{{ option.label }}</option>
				}
			</select>
		</hlm-field>
	</div>

	@if (errorMessage()) {
		<div class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm">
			{{ errorMessage() }}
		</div>
	}

	<div class="flex items-center justify-end gap-2">
		<button type="button" hlmBtn variant="outline" (click)="cancel()">Cancelar</button>
		<button type="submit" hlmBtn [disabled]="isSubmitting()">Crear usuario</button>
	</div>
</form>

<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<section class="bg-muted/40 rounded-lg border p-4 text-sm">
		<p class="font-medium">
			{{ title() }}
		</p>

		<p class="text-muted-foreground mt-1 leading-6">
			{{ description() }}
		</p>

		<p class="text-muted-foreground mt-3 leading-6">
			{{ helperText() }}
		</p>
	</section>

	<hlm-field>
		<label hlmFieldLabel for="response_message"> Mensaje de respuesta </label>

		<textarea
			id="response_message"
			formControlName="response_message"
			rows="4"
			class="border-input bg-background text-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-ring/50 w-full rounded-md border px-3 py-2 text-sm outline-none focus-visible:ring-[3px]"
			placeholder="Mensaje opcional para el cliente o la operación."
		></textarea>

		@if (
			form.controls.response_message.touched &&
			form.controls.response_message.hasError("maxlength")
		) {
			<hlm-field-error forceShow>
				El mensaje no puede superar los 1000 caracteres.
			</hlm-field-error>
		}
	</hlm-field>

	@if (errorMessage()) {
		<div
			class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm"
		>
			{{ errorMessage() }}
		</div>
	}

	<div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
		<button
			type="button"
			hlmBtn
			variant="outline"
			class="cursor-pointer"
			[disabled]="isSubmitting()"
			(click)="cancel()"
		>
			Cancelar
		</button>

		<button
			type="submit"
			hlmBtn
			class="cursor-pointer"
			[variant]="mode() === 'REJECT' ? 'destructive' : 'default'"
			[disabled]="isSubmitting()"
		>
			{{ submitLabel() }}
		</button>
	</div>
</form>

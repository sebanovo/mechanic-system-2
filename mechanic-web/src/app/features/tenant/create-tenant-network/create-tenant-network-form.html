<form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
	<hlm-field>
		<label hlmFieldLabel for="commercial_name">Nombre comercial</label>

		<input
			id="commercial_name"
			type="text"
			hlmInput
			formControlName="commercial_name"
			placeholder="Speed Motors Norte"
			autocomplete="organization"
		/>

		@if (
			form.controls.commercial_name.touched &&
			form.controls.commercial_name.hasError("required")
		) {
			<hlm-field-error forceShow>
				El nombre comercial es obligatorio.
			</hlm-field-error>
		}
	</hlm-field>

	@if (errorMessage()) {
		<div
			class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm"
		>
			{{ errorMessage() }}
		</div>
	}

	<div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
		<button
			type="button"
			hlmBtn
			variant="outline"
			class="cursor-pointer"
			[disabled]="isSubmitting()"
			(click)="cancel()"
		>
			Cancelar
		</button>

		<button
			type="submit"
			hlmBtn
			class="cursor-pointer"
			[disabled]="isSubmitting()"
		>
			@if (isSubmitting()) {
				Creando...
			} @else {
				Crear red
			}
		</button>
	</div>
</form>

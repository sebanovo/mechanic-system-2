<div class="space-y-5">
	<div class="space-y-3">
		@for (tenant of sessionStore.availableTenants(); track tenant.id) {
			<button
				type="button"
				class="bg-card text-card-foreground hover:bg-accent w-full rounded-xl border p-4 text-left transition"
				[class.ring-2]="selectedTenantId() === tenant.id"
				[class.ring-primary]="selectedTenantId() === tenant.id"
				(click)="selectTenant(tenant.id)"
			>
				<p class="font-medium">
					{{ tenant.commercial_name }}
				</p>

				<p class="text-muted-foreground mt-1 text-sm">
					{{ tenant.tenant_kind }} · {{ tenant.status }}
				</p>
			</button>
		}
	</div>

	@if (sessionStore.availableTenants().length === 0) {
		<div
			class="bg-muted text-muted-foreground rounded-md border px-3 py-2 text-sm"
		>
			No tienes tenants disponibles para seleccionar.
		</div>
	}

	@if (errorMessage()) {
		<div
			class="border-destructive/40 bg-destructive/10 text-destructive rounded-md border px-3 py-2 text-sm"
		>
			{{ errorMessage() }}
		</div>
	}

	<button
		type="button"
		hlmBtn
		class="w-full cursor-pointer"
		[disabled]="!selectedTenantId() || isSubmitting()"
		(click)="continue()"
	>
		@if (isSubmitting()) {
			Seleccionando...
		} @else {
			Continuar
		}
	</button>
</div>

<header class="bg-background sticky top-0 z-50 border-b border-b-primary">
	<div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
		<a [routerLink]="appRoutes.public.home" fragment="home"
			class="text-foreground flex items-center gap-3 font-semibold" aria-label="Ir al inicio">
			<span class="flex size-10 items-center justify-center rounded-xl border border-black/40 bg-primary p-1">
				<img src="/logo2.png" alt="Mechanic" class="size-full object-contain" />
			</span>

			<span class="font-display text-sm uppercase tracking-[0.2em] text-primary sm:text-base">
				Mechanic
			</span>
		</a>

		<nav class="hidden items-center gap-1 lg:flex" aria-label="Navegación principal">
			@for (item of navigationItems().links; track item.id) {
			<a [routerLink]="appRoutes.public.home" [fragment]="item.fragment"
				class="text-foreground hover:bg-primary hover:text-primary-foreground rounded-md border border-transparent px-3 py-2 text-sm font-medium transition hover:border-primary">
				{{ item.label }}
			</a>
			}
		</nav>

		<div class="hidden items-center gap-2 lg:flex">
			<a [routerLink]="appRoutes.auth.login"
				class="text-foreground hover:bg-black hover:text-primary rounded-md border border-black px-4 py-2 text-sm font-medium transition">
				Iniciar sesión
			</a>

			<a [routerLink]="appRoutes.auth.register"
				class="bg-primary text-primary-foreground rounded-md border border-black px-4 py-2 text-sm font-bold uppercase tracking-[0.14em] shadow-sm transition hover:bg-primary/90">
				Crear cuenta
			</a>
		</div>

		<button type="button"
			class="bg-primary text-primary-foreground inline-flex size-10 items-center justify-center rounded-md border border-black lg:hidden"
			aria-label="Abrir menú" [attr.aria-expanded]="isMobileMenuOpen()" (click)="toggleMobileMenu()">
			@if (!isMobileMenuOpen()) {
			<span class="text-xl leading-none">☰</span>
			} @else {
			<span class="text-xl leading-none">×</span>
			}
		</button>
	</div>

	@if (isMobileMenuOpen()) {
	<div class="bg-card border-t border-t-primary lg:hidden">
		<nav class="mx-auto flex max-w-7xl flex-col gap-1 px-4 py-4 sm:px-6">
			@for (item of navigationItems().links; track item.id) {
			<a [routerLink]="appRoutes.public.home" [fragment]="item.fragment"
				class="text-foreground hover:bg-primary hover:text-primary-foreground rounded-md border border-transparent px-3 py-3 text-sm font-medium transition hover:border-primary"
				(click)="closeMobileMenu()">
				{{ item.label }}
			</a>
			}

			<div class="mt-4 grid gap-2 border-t border-t-primary/40 pt-4">
				<a [routerLink]="appRoutes.auth.login"
					class="text-foreground rounded-md border border-black px-4 py-3 text-center text-sm font-medium"
					(click)="closeMobileMenu()">
					Iniciar sesión
				</a>

				<a [routerLink]="appRoutes.auth.register"
					class="bg-primary text-primary-foreground rounded-md border border-black px-4 py-3 text-center text-sm font-bold uppercase tracking-[0.14em]"
					(click)="closeMobileMenu()">
					Crear cuenta
				</a>
			</div>
		</nav>
	</div>
	}
</header>

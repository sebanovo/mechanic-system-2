<section id="how-it-works" class="bg-background border-t py-20 sm:py-24">
	<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
		<div class="mx-auto max-w-2xl text-center">
			<p class="text-muted-foreground text-sm font-semibold">Cómo funciona</p>

			<h2
				class="text-foreground mt-3 text-3xl font-bold tracking-tight sm:text-4xl"
			>
				Del incidente a la atención en pocos pasos
			</h2>

			<p class="text-muted-foreground mt-4 text-base leading-7">
				Un flujo simple para clientes, talleres y técnicos.
			</p>
		</div>

		<div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
			@for (step of steps; track step.number) {
				<article
					class="bg-card text-card-foreground rounded-2xl border p-5 shadow-sm"
				>
					<div
						class="bg-primary text-primary-foreground mb-5 flex size-11 items-center justify-center rounded-xl text-sm font-bold"
					>
						{{ step.number }}
					</div>

					<h3 class="text-base font-semibold">
						{{ step.title }}
					</h3>

					<p class="text-muted-foreground mt-3 text-sm leading-6">
						{{ step.description }}
					</p>
				</article>
			}
		</div>
	</div>
</section>

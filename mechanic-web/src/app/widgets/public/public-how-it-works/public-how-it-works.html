<section id="how-it-works" class="bg-app-content border-t py-20 sm:py-24">
	<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
		<div class="mx-auto max-w-3xl text-center">
			<p class="text-primary text-sm font-semibold uppercase tracking-[0.24em]">Flujo operativo</p>

			<h2
				class="text-foreground mt-4 text-3xl font-semibold tracking-tight sm:text-4xl"
			>
				Del reporte al cierre, todo queda visible
			</h2>

			<p class="text-muted-foreground mt-4 text-base leading-7">
				Un flujo simple para clientes, talleres, técnicos y superadmin. Menos fricción para operar más casos.
			</p>
		</div>

		<div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
			@for (step of steps; track step.number) {
				<article class="bg-card text-card-foreground rounded-2xl border p-5 shadow-sm">
					<div class="mb-5 flex items-start justify-between gap-3">
						<div class="bg-primary/10 text-primary flex size-11 items-center justify-center rounded-2xl">
							<ng-icon [name]="'lucide' + step.icon" class="size-5" />
						</div>
						<span class="text-muted-foreground text-sm font-semibold">{{ step.number }}</span>
					</div>

					<h3 class="text-base font-semibold">
						{{ step.title }}
					</h3>

					<p class="text-muted-foreground mt-3 text-sm leading-6">
						{{ step.description }}
					</p>
				</article>
			}
		</div>
	</div>
</section>

<section id="how-it-works" class="bg-background border-t border-t-primary py-20 sm:py-24">
	<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
		<div class="mx-auto max-w-3xl text-center">
			<p class="text-primary text-sm font-bold uppercase tracking-[0.28em]">Flujo operativo</p>

			<h2 class="text-foreground mt-4 text-3xl font-black uppercase tracking-[0.05em] sm:text-4xl">
				Del reporte al cierre, todo queda visible
			</h2>

			<p class="text-foreground/75 mt-4 text-base leading-7">
				Un flujo simple para clientes, talleres, técnicos y plataforma, sin mezclar
				responsabilidades.
			</p>
		</div>

		<div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
			@for (step of steps; track step.number) {
				<article class="bg-card rounded-2xl border border-black p-5">
					<div class="mb-5 flex items-start justify-between gap-3">
						<div class="flex size-12 items-center justify-center rounded-2xl border border-black bg-black text-primary">
							<ng-icon [name]="step.icon" class="size-5" />
						</div>

						<span class="rounded-full border border-black bg-primary px-3 py-1 text-xs font-bold uppercase tracking-[0.14em] text-black">
							{{ step.number }}
						</span>
					</div>

					<h3 class="text-base font-semibold text-card-foreground">
						{{ step.title }}
					</h3>

					<p class="text-foreground/75 mt-3 text-sm leading-6">
						{{ step.description }}
					</p>
				</article>
			}
		</div>
	</div>
</section>

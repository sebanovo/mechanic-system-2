<section id="services" class="bg-app-content py-20 sm:py-24">
	<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
		<div class="max-w-2xl">
			<p class="text-muted-foreground text-sm font-semibold">Servicios</p>

			<h2
				class="text-foreground mt-3 text-3xl font-bold tracking-tight sm:text-4xl"
			>
				Servicios principales de asistencia
			</h2>

			<p class="text-muted-foreground mt-4 text-base leading-7">
				Diseñado para cubrir incidentes comunes en carretera, ciudad o
				domicilio.
			</p>
		</div>

		<div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
			@for (service of services; track service.title) {
				<article class="bg-card rounded-2xl border p-5 shadow-sm">
					<div class="bg-accent mb-4 size-10 rounded-xl"></div>

					<h3 class="text-card-foreground text-base font-semibold">
						{{ service.title }}
					</h3>

					<p class="text-muted-foreground mt-2 text-sm leading-6">
						{{ service.description }}
					</p>
				</article>
			}
		</div>
	</div>
</section>

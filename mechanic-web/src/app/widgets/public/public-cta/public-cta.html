<section class="bg-app-content py-20 sm:py-24">
	<div class="mx-auto max-w-5xl px-4 text-center sm:px-6 lg:px-8">
		<div class="bg-card rounded-3xl border px-6 py-12 shadow-sm sm:px-10">
			<h2
				class="text-card-foreground text-3xl font-bold tracking-tight sm:text-4xl"
			>
				¿Listo para llevar tu operación a Mechanic?
			</h2>

			<p
				class="text-muted-foreground mx-auto mt-4 max-w-2xl text-base leading-7"
			>
				Crea una cuenta como cliente o registra tu taller para empezar a gestionar incidencias, seguimiento y auditoría desde un mismo sistema.
			</p>

			<div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
				<a
					[routerLink]="appRoutes.auth.registerClient"
					class="bg-primary text-primary-foreground inline-flex items-center justify-center rounded-md px-5 py-3 text-sm font-medium shadow-sm transition hover:opacity-90"
				>
					Crear cuenta cliente
				</a>

				<a
					[routerLink]="appRoutes.auth.registerTenant"
					class="bg-background text-foreground hover:bg-accent inline-flex items-center justify-center rounded-md border px-5 py-3 text-sm font-medium transition"
				>
					Registrar taller
				</a>
			</div>
		</div>
	</div>
</section>

<section class="bg-app-content border-t border-t-primary py-20 sm:py-24">
	<div class="mx-auto max-w-5xl px-4 text-center sm:px-6 lg:px-8">
		<div class="rounded-3xl border border-black bg-card px-6 py-12 sm:px-10">
			<h2 class="text-card-foreground text-3xl font-black uppercase tracking-[0.05em] sm:text-4xl">
				¿Listo para llevar tu operación a Mechanic?
			</h2>

			<p class="text-foreground/75 mx-auto mt-4 max-w-2xl text-base leading-7">
				Crea una cuenta como cliente o registra tu taller para empezar a gestionar
				incidencias, seguimiento y auditoría desde un mismo sistema.
			</p>

			<div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
				<a
					[routerLink]="appRoutes.auth.registerClient"
					class="inline-flex items-center justify-center rounded-xl border border-black bg-primary px-5 py-3 text-sm font-bold uppercase tracking-[0.14em] text-black transition hover:opacity-90"
				>
					Crear cuenta cliente
				</a>

				<a
					[routerLink]="appRoutes.auth.registerTenant"
					class="inline-flex items-center justify-center rounded-xl border border-black bg-black px-5 py-3 text-sm font-bold uppercase tracking-[0.14em] text-primary transition hover:bg-black/90"
				>
					Registrar taller
				</a>
			</div>
		</div>
	</div>
</section>

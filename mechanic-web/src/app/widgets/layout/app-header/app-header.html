<header
	class="bg-app-header text-app-header-foreground sticky top-0 z-30 border-b border-b-primary"
>
	<div class="flex h-16 items-center justify-between gap-3 px-4 sm:px-6">
		<div class="flex min-w-0 items-center gap-3">
			<button
				type="button"
				hlmBtn
				variant="ghost"
				size="icon"
				class="cursor-pointer border border-primary/30 bg-primary/10 text-primary lg:hidden"
				aria-label="Abrir menú"
				(click)="menuClicked.emit()"
			>
				<ng-icon hlm name="lucideMenu" size="sm" />
			</button>

			<div class="min-w-0">
				<div class="flex min-w-0 items-center gap-3">
					<h1 class="truncate text-sm font-semibold uppercase tracking-[0.22em] text-primary sm:text-base">
						{{ title() }}
					</h1>

					@if (tenantName()) {
						<span
							class="bg-primary text-primary-foreground hidden rounded-full px-3 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.16em] sm:inline-flex"
						>
							{{ tenantName() }}
						</span>
					}
				</div>

				@if (subtitle()) {
					<p class="text-app-header-foreground/70 hidden truncate text-xs sm:block">
						{{ subtitle() }}
					</p>
				}
			</div>
		</div>

		<div class="flex shrink-0 items-center gap-1 sm:gap-2">
			<!-- <app-notification-button /> -->
			<app-notification-bell />
			<app-user-menu />
		</div>
	</div>
</header>

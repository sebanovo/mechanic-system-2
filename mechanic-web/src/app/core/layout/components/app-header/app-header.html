<header
	class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur"
>
	<div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6">
		<div class="flex min-w-0 items-center gap-3">
			<button
				type="button"
				(click)="openMobileSidebar()"
				class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:bg-slate-50 lg:hidden"
				aria-label="Abrir menú lateral"
			>
				<ng-icon name="lucideMenu" class="text-lg" />
			</button>

			<div class="min-w-0">
				<p class="truncate text-sm font-semibold text-slate-500">
					{{ subtitle() }}
				</p>
				<h1 class="truncate text-lg font-bold text-slate-900">
					{{ title() }}
				</h1>
			</div>
		</div>

		@if (showSearch()) {
			<div
				class="hidden w-full max-w-lg items-center rounded-xl border border-slate-200 bg-white px-3 py-2 shadow-sm md:flex"
			>
				<ng-icon name="lucideSearch" class="mr-3 text-lg text-slate-400" />

				<input
					type="search"
					[placeholder]="searchPlaceholder()"
					class="w-full bg-transparent text-sm text-slate-700 outline-none placeholder:text-slate-400"
				/>
			</div>
		}

		<div class="flex shrink-0 items-center gap-3">
			@if (showNotifications()) {
				<button
					type="button"
					(click)="onClickNotifications()"
					title="Ver notificaciones"
					class="relative inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:bg-slate-50 hover:text-slate-950"
					aria-label="Ver notificaciones"
				>
					<ng-icon name="lucideBell" class="text-lg" />
					<span
						class="absolute top-2 right-2 h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"
					></span>
				</button>
			}

			@if (showProfile()) {
				<app-user-menu
					[userName]="userName()"
					[userEmail]="userEmail()"
					[avatarUrl]="avatarUrl()"
					(changePasswordClick)="onClickChangePassword()"
					(profileClick)="onClickPerfil()"
					(settingsClick)="onClickSettings()"
					(logoutClick)="onClickLogout()"
				/>
			}
		</div>
	</div>
</header>

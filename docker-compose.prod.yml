services:
  serv-mech-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - mech_db_data:/var/lib/postgresql/data
    networks:
      - mechanic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  serv-mech-api:
    image: sebastiandevjs/mech-api:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      serv-mech-db:
        condition: service_healthy
    networks:
      - mechanic-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  serv-mech-web:
    image: sebastiandevjs/mech-web:1.0.0
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - serv-mech-api
    networks:
      - mechanic-net

  serv-mech-flutter-web:
    image: sebastiandevjs/mech-flutter-web:1.0.0
    restart: unless-stopped
    depends_on:
      - serv-mech-api
    networks:
      - mechanic-net

  serv-nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    depends_on:
      - serv-mech-web
      - serv-mech-api
      - serv-mech-flutter-web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - mechanic-net

volumes:
  mech_db_data:

networks:
  mechanic-net:
    name: mechanic-system_mechanic-net
    driver: bridge

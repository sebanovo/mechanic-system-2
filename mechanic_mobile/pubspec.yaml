name: mechanic_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4 # para generar los iconos al hacer build en distintas plataformas
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  go_router: ^17.2.0 # nevegador inferior sencillo
  shared_preferences: ^2.5.4
  speech_to_text: ^7.3.0 # (Agregar permisos)
  openai_dart: ^4.0.1 # libreria para usar el LLM de openai para usar el modelo de OpenRouter 
  image_picker: ^1.2.1 # (Agregar permisos)
  dio: ^5.9.2 # (El axios de flutter)
  get_it: ^9.2.1 #(Para injection de dependencias)
  http_parser: ^4.1.2 #(Para serializar formatos de image/audio/etc)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0 #(Para notificaciones push)
  flutter_local_notifications: ^21.0.0 #(Para notificacione push offline)
  equatable: ^2.0.8 #(Para comparar objetos de forma profunda o1 == o2)
  device_info_plus: ^12.4.0 #(Para obtener información detallada del dispositivo)
  package_info_plus: ^9.0.0 #(Para obtener información detallada de la app, como la version)
  universal_html: ^2.3.0 #(Para html en dart que funcione en web y mobile)
  provider: ^6.1.5+1 #(Para escuchar proveedores)
  connectivity_plus: ^6.1.5 #(Detectar estado de red)
  path: ^1.9.1 #(Construir rutas de archivos)
  path_provider: ^2.1.5 #(Ruta del archivo SQLite)
  sqflite: ^2.4.1 #(SQLite local para modo offline)
  skeletonizer: ^2.1.3 #(Para skeletons en vistas)
  web_socket_channel: ^3.0.3 #(WebSocket de tracking en vivo)
  # timezone: ^0.11.0 #(Para obtener la hora)
  flutter_map: ^8.3.0 #(Para maás en flutter alternativa a google_maps)
  geolocator: ^14.0.2 #(Obtener coordenadas del dispositivo)
  latlong2: ^0.9.1 #(Para calcular latitud y longitud)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

flutter_launcher_icons:
  image_path: "assets/logo2.png" 
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo2.png"
  windows:
    generate: true
    image_path: "assets/logo2.png"
  macos:
    generate: true
    image_path: "assets/logo2.png"
  linux:
    generate: true
    image_path: "assets/logo2.png"

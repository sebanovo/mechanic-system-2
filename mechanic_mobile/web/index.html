<!DOCTYPE html>
<html>

<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mechanic_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>mechanic_mobile</title>
  <link rel="manifest" href="manifest.json">

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAiJtT0pDTgUmLa61eWyE-TCA4v9oHdN3s",
      authDomain: "mechanic-system-60380.firebaseapp.com",
      projectId: "mechanic-system-60380",
      storageBucket: "mechanic-system-60380.firebasestorage.app",
      messagingSenderId: "249326114363",
      appId: "1:249326114363:web:a949b8f9c786313831ae1e",
      measurementId: "G-707G8X95T4"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const messaging = getMessaging(app);

    const base = document.querySelector('base')?.getAttribute('href') || '/';
    const baseUrl = base.endsWith('/') ? base : base + '/';
    const swPath = baseUrl + 'firebase-messaging-sw.js';

    console.log('Service Worker path:', swPath);
    navigator.serviceWorker.register(swPath)
      .then(registration => getToken(messaging, {
        vapidKey: 'BNKs9MawNjRfsrgM8vj4xYnPVWMOCYlsJZVnM4-7R7yK9xChXQR0WaYJiJsdo4_sfOshIxGnx78zQCK2DPepPLs',
        serviceWorkerRegistration: registration
      }))
      .then(currentToken => {
        if (currentToken) {
          console.log('✅ FCM Token web:', currentToken);
          window.parent.postMessage({ type: 'fcmToken', token: currentToken }, '*');
        } else {
          console.log('⚠️ No se pudo obtener token FCM');
        }
      })
      .catch(err => console.log('❌ Error obteniendo token FCM:', err));

    onMessage(messaging, (payload) => {
      console.log('🔔 Notificación en primer plano:', payload);
      if (window.showNotification) {
        window.showNotification(
          payload.notification.title,
          payload.notification.body,
          payload.data?.actionUrl
        );
      }
    });
  </script>
</body>

</html>
